<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>CLick on button to perform Operation :</h1>
    <br />
    <p>Add element in Array:</p>
    <button onclick="push()">push</button>
    <br />
    <br />
    <p>Delete element from an Array:</p>
    <button onclick="pop()">Delete</button>
    
    <br />
    <br />
    <p>Add element in Array from right side:</p>
    <button onclick="unShift()">unShift</button>
    <br />
    <br />
    <p>Delete element from an Array from right side:</p>
    <button onclick="shift()">Shift</button>
<br>
<br>
    <p>Show output in console</p>
    <script src="./script.js"></script>
  </body>
</html>
